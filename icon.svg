<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDEE9" />
      <stop offset="100%" stop-color="#B5FFFC" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <drop-shadow dx="0" dy="8" stdDeviation="6" flood-color="#FF8DA1" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="230" fill="url(#pinkGrad)" stroke="#FFFFFF" stroke-width="12" filter="url(#shadow)" />
  
  <!-- Sparkles -->
  <path d="M 120,130 L 125,115 L 140,110 L 125,105 L 120,90 L 115,105 L 100,110 L 115,115 Z" fill="#FF8DA1" />
  <path d="M 390,390 L 393,380 L 403,377 L 393,374 L 390,364 L 387,374 L 377,377 L 387,380 Z" fill="#9C8EB9" />
  <circle cx="380" cy="150" r="10" fill="#FF8DA1" />
  
  <!-- Main German Heart -->
  <g transform="translate(136, 150) scale(1.5)" filter="url(#shadow)">
    <!-- Heart Path with Clip Path for German Flag colors -->
    <clipPath id="heartClip">
      <path d="M 80,45 C 80,45 60,10 35,10 C 15,10 0,25 0,45 C 0,75 35,100 80,130 C 125,100 160,75 160,45 C 160,25 145,10 125,10 C 100,10 80,45 80,45 Z" />
    </clipPath>
    
    <g clip-path="url(#heartClip)">
      <!-- German Flag stripes: Black, Red, Gold -->
      <rect x="0" y="0" width="160" height="42" fill="#000000" />
      <rect x="0" y="42" width="160" height="43" fill="#DD0000" />
      <rect x="0" y="85" width="160" height="45" fill="#FFCC00" />
    </g>
    
    <!-- Heart Border -->
    <path d="M 80,45 C 80,45 60,10 35,10 C 15,10 0,25 0,45 C 0,75 35,100 80,130 C 125,100 160,75 160,45 C 160,25 145,10 125,10 C 100,10 80,45 80,45 Z" fill="none" stroke="#FFFFFF" stroke-width="6" />
  </g>
  
  <!-- Cute Ribbon / Bow at the bottom -->
  <path d="M 200,410 C 220,380 292,380 312,410 C 322,425 292,440 256,420 C 220,440 190,425 200,410 Z" fill="#FF8DA1" stroke="#FFFFFF" stroke-width="4" />
  <circle cx="256" cy="413" r="12" fill="#FFFFFF" />
</svg>
